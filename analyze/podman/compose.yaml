name: wtt-analyze

services:
  influxdb:
    image: docker.io/library/influxdb:2.9.1
    restart: unless-stopped
    networks:
      - influx
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:?set INFLUX_ADMIN_USER in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?set INFLUX_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:?set INFLUX_ORG in .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:?set INFLUX_BUCKET in .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: docker.io/grafana/grafana:12.4.3
    restart: unless-stopped
    networks:
      - influx
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_DATAPROXY_TIMEOUT: ${GRAFANA_QUERY_TIMEOUT_SECONDS:-120}
      GF_DATAPROXY_MAX_CONNS_PER_HOST: ${GRAFANA_MAX_CONNS_PER_HOST:-4}
      INFLUX_ORG: ${INFLUX_ORG:?set INFLUX_ORG in .env}
      INFLUX_BUCKET: ${INFLUX_BUCKET:?set INFLUX_BUCKET in .env}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - grafana-data:/var/lib/grafana
      - ../files/influxdb.yaml:/etc/grafana/provisioning/datasources/influxdb.yaml:ro,Z
      - ../files/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml:ro,Z
      - ../dashboards:/var/lib/grafana/dashboards:ro,Z

  renderer:
    image: docker.io/grafana/grafana-image-renderer:v4.1.5
    restart: unless-stopped
    networks:
      - influx

  importer:
    image: docker.io/library/alpine:3.21.3
    restart: "no"
    depends_on:
      influxdb:
        condition: service_healthy
    # Rootless Podman bridge networking may lack an outbound route. The
    # importer is short-lived and uses only InfluxDB's loopback-only binding.
    network_mode: host
    environment:
      INFLUX_URL: http://127.0.0.1:8086
      INFLUX_ORG: ${INFLUX_ORG:?set INFLUX_ORG in .env}
      INFLUX_BUCKET: ${INFLUX_BUCKET:?set INFLUX_BUCKET in .env}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
      IMPORT_RESULTS_DIR: ${IMPORT_RESULTS_DIR:-}
      IMPORT_ARTIFACT_DIR: ${IMPORT_ARTIFACT_DIR:-}
      IMPORT_WORKERS: ${IMPORT_WORKERS:-16}
      IMPORT_SKIP_WARMUP: ${IMPORT_SKIP_WARMUP:-false}
    command:
      - /bin/sh
      - -c
      - >-
        set -eu;
        oras_version=1.3.0;
        apk add --no-cache bash curl python3 py3-pip;
        pip install --break-system-packages --root-user-action=ignore --no-cache-dir influxdb-client==1.50.0;
        curl -fsSL -o /tmp/oras.tar.gz
        "https://github.com/oras-project/oras/releases/download/v$${oras_version}/oras_$${oras_version}_linux_amd64.tar.gz";
        tar -xzf /tmp/oras.tar.gz -C /usr/local/bin oras;
        rm /tmp/oras.tar.gz;
        exec /bin/bash /scripts/import-results.sh
    volumes:
      - ../files/import-results.sh:/scripts/import-results.sh:ro,Z
      - ../files/import-results.py:/scripts/import-results.py:ro,Z
      - ${COMPOSE_RESULTS_DIR:-/tmp}:/results:ro

volumes:
  grafana-data:
    name: wtt-analyze-grafana-data
  influxdb-data:
    name: wtt-analyze-influxdb-data
  influxdb-config:
    name: wtt-analyze-influxdb-config

networks:
  influx:
    internal: true
