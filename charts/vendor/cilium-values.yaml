# cilium-values.yaml — Cilium CNI configuration for Where-To-TLS benchmark.
# Replaces kube-proxy completely (kubeadm init uses --skip-phases=addon/kube-proxy).
kubeProxyReplacement: true
# Replaced with the control-plane private address by configure-cluster.sh.
k8sServiceHost: "__APISERVER_HOST__"
k8sServicePort: "6443"

cni:
  chainMode: "none"

ipam:
  mode: "kubernetes"

ipv4:
  enabled: true

ipv6:
  enabled: false

controlPlaneNodeSelector: &controlPlaneNodeSelector
  wtt/pool: cp

controlPlaneTolerations: &controlPlaneTolerations
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node.cloudprovider.kubernetes.io/uninitialized
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoSchedule

operator:
  replicas: 1
  nodeSelector: *controlPlaneNodeSelector
  tolerations: *controlPlaneTolerations

# Tunnel routing via VXLAN (standard on Azure self-hosted k8s across subnets)
routingMode: "tunnel"
tunnelProtocol: "vxlan"


monitoringEnabled: &monitoringEnabled false
hubble:
  enabled: *monitoringEnabled
  relay:
    enabled: *monitoringEnabled
    nodeSelector: *controlPlaneNodeSelector
    tolerations: *controlPlaneTolerations
  ui:
    enabled: *monitoringEnabled
    nodeSelector: *controlPlaneNodeSelector
    tolerations: *controlPlaneTolerations

prometheus:
  metricsService: *monitoringEnabled
  enabled: *monitoringEnabled
  port: 9962
  serviceMonitor:
    enabled: *monitoringEnabled
    labels:
      release: wtt-monitoring


envoy:
  enabled: false

envoyConfig:
  enabled: false

ingressController:
  enabled: false

gatewayAPI:
  enabled: false

l7Proxy: false

debug:
  enabled: false
