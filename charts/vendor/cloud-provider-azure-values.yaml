# cloud-provider-azure-values.yaml — Azure Cloud Controller Manager configuration
infra:
  clusterName: "wtt-perf-k8s"

cloudControllerManager:
  cloudConfig: "/etc/kubernetes/azure.json"
  configureCloudRoutes: "false"
  allocateNodeCidrs: "false"
  nodeSelector:
    wtt/pool: cp
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node.cloudprovider.kubernetes.io/uninitialized"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node.kubernetes.io/not-ready"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "CriticalAddonsOnly"
      operator: "Exists"

cloudNodeManager:
  enabled: true
  tolerations:
    - operator: "Exists"
