{{- $routing := .Values.routing -}}
{{- if eq $routing.mode "passthrough" }}
{{- $workload := include "apps.selectedWorkload" . | fromJson -}}
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ .Release.Name }}-tlsroute
  labels:
{{ include "apps.routingLabels" . | indent 4 }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
      sectionName: tls-passthrough
  hostnames:
    - {{ printf "%s.wtt.local" $workload.labels.scenario | quote }}
  rules:
    - backendRefs:
        - name: {{ .Release.Name }}
          port: {{ $routing.backendPort }}
{{- end }}
