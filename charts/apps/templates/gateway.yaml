{{- $routing := .Values.routing -}}
{{- if or (eq $routing.mode "passthrough") (eq $routing.mode "terminate") }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-gateway
  labels:
{{ include "apps.routingLabels" . | indent 4 }}
spec:
  gatewayClassName: {{ $routing.gatewayClass }}
  listeners:
{{- if eq $routing.mode "passthrough" }}
    - name: tls-passthrough
      protocol: TLS
      port: {{ $routing.listenerPort }}
      tls:
        mode: Passthrough
      allowedRoutes:
        kinds:
          - kind: TLSRoute
{{- else }}
    - name: https-terminate
      protocol: HTTPS
      port: {{ $routing.listenerPort }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $routing.certificateSecretName }}
        options:
          traefik.io/tlsoption: default
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
{{- end }}
{{- end }}
