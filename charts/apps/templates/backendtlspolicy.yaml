{{- $routing := .Values.routing -}}
{{- if and (eq $routing.mode "terminate") $routing.backendTLS.enabled }}
{{- $workload := include "apps.selectedWorkload" . | fromJson -}}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ .Release.Name }}-backend-tls
  labels:
{{ include "apps.routingLabels" . | indent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}
      sectionName: https
  validation:
    hostname: {{ printf "%s.wtt.local" $workload.labels.scenario | quote }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ $routing.backendTLS.caConfigMapName }}
{{- end }}
