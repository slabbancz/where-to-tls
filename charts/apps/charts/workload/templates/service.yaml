{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workload.name" . }}
  labels:
{{ include "workload.labels" . | indent 4 }}
  annotations:
{{ toYaml .Values.service.annotations | indent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
{{ include "workload.selectorLabels" . | indent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.tlsPort }}
      targetPort: https
      protocol: TCP
    - name: http
      port: {{ .Values.service.plainPort }}
      targetPort: http
      protocol: TCP
{{- end }}
