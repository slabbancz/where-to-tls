runName: Simple TLS race
k6:
  options:
    quiet: false
    verbose: false
    summaryMode: full
  dashboard:
    enabled: true
    intervalSeconds: 5
matrix:
  endpoints:
    - path: /payload
      payloadBytes: 1024
  httpVersions: ["1.1"]
  tlsResumption: [false]
  connectionReuse: [false]
  profiles:
    - name: race
      iterations: 100000
      vus: 100
      maxDurationSeconds: 60
    # - name: race
    #   iterations: 100000
    #   vus: 10
    #   maxDurationSeconds: 60
    # - name: race
    #   iterations: 100000
    #   vus: 50
    #   maxDurationSeconds: 60
    # - name: race
    #   iterations: 100000
    #   vus: 100
    #   maxDurationSeconds: 60
    # - name: race
    #   iterations: 100000
    #   vus: 1000
    #   maxDurationSeconds: 60
  warmupSeconds: 0
  repeats: 1
