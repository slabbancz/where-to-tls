runName: Linear TLS fresh discovery
k6:
  options:
    quiet: false
    verbose: false
    summaryMode: full
  dashboard:
    enabled: true
    intervalSeconds: 5
matrix:
  endpoints:
    - path: /payload
      payloadBytes: 1024
  httpVersions: ["1.1"]
  tlsResumption: [false]
  connectionReuse: [false]
  profiles:
    - name: linear
      start: 100
      end: 6000
      sampling: 10
      windowSeconds: 120
      preAllocatedVUs: 20
      maxVUs: 50
    - name: linear
      start: 100
      end: 6000
      sampling: 10
      windowSeconds: 60
      preAllocatedVUs: 100
      maxVUs: 100
    - name: linear
      start: 100
      end: 6000
      sampling: 10
      windowSeconds: 60
      preAllocatedVUs: 100
      maxVUs: 1000
  warmupSeconds: 0
  repeats: 1
